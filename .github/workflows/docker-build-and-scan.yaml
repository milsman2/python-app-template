name: Docker Build and Trivy Scan

on:
  workflow_call:
    inputs:
      DOCKER_PATH_CONTEXT:
        required: true
        type: string
      DOCKER_BUILD_DOCKERFILE:
        required: true
        type: string
      DOCKER_TAGS:
        required: true
        type: string
      DOCKER_USERNAME:
        required: true
        type: string

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ inputs.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.DOCKER_PATH_CONTEXT }}
          file: ${{ inputs.DOCKER_BUILD_DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: docker.io/${{ inputs.DOCKER_TAGS }}

      - name: Build local image for scanning
        if: ${{ secrets.DOCKERHUB_TOKEN == '' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.DOCKER_PATH_CONTEXT }}
          file: ${{ inputs.DOCKER_BUILD_DOCKERFILE }}
          platforms: linux/amd64
          load: true
          no-cache: true
          tags: docker.io/${{ inputs.DOCKER_TAGS }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/${{ inputs.DOCKER_TAGS }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
