name: Docker Build and Trivy Scan

on:
  workflow_call:
    inputs:
      DOCKER_PATH_CONTEXT:
        required: true
        type: string
      DOCKER_BUILD_DOCKERFILE:
        required: true
        type: string
      DOCKER_TAGS:
        required: true
        type: string
      DOCKER_LOAD_BOOL:
        required: false
        type: boolean
        default: false
      DOCKER_PUSH_BOOL:
        required: false
        type: boolean
        default: false
      DOCKER_USERNAME:
        required: true
        type: string

jobs:
  build-and-scan:
    env:
      DOCKER_PATH_CONTEXT: ${{ inputs.DOCKER_PATH_CONTEXT }}
      DOCKER_BUILD_DOCKERFILE: ${{ inputs.DOCKER_BUILD_DOCKERFILE }}
      DOCKER_TAGS: ${{ inputs.DOCKER_TAGS }}
      DOCKER_LOAD_BOOL: ${{ inputs.DOCKER_LOAD_BOOL }}
      DOCKER_PUSH_BOOL: ${{ inputs.DOCKER_PUSH_BOOL }}
      DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and maybe push) Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{  env.DOCKER_PATH_CONTEXT }}
          file: ${{  env.DOCKER_BUILD_DOCKERFILE}}
          load: ${{ env.DOCKER_LOAD_BOOL }}
          push: ${{ env.DOCKER_PUSH_BOOL }}
          tags: ${{  env.DOCKER_TAGS }}
      - name: Run Trivy vulnerability scanner (remote)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: docker.io/${{ env.DOCKER_TAGS }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
