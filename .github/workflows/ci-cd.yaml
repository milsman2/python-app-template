name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

  workflow_call:
    inputs:
      UV_VERSION:
        required: false
        type: string
        default: '0.12.7'
      PYTHON_VERSION:
        required: false
        type: string
        default: '3.13'
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    uses: milsman2/python-app-template/.github/workflows/ruff.yaml@main
    with:
      UV_VERSION: ${{ inputs.UV_VERSION || vars.UV_VERSION || '0.12.7' }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION || vars.PYTHON_VERSION || '3.13' }}

  test:
    needs: lint
    uses: milsman2/python-app-template/.github/workflows/pytest.yaml@main
    with:
      UV_VERSION: ${{ inputs.UV_VERSION || vars.UV_VERSION || '0.12.7' }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION || vars.PYTHON_VERSION || '3.13' }}

  docker-build-and-image-scan:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_call'
    needs: test
    uses: milsman2/python-app-template/.github/workflows/docker-build-and-scan.yaml@main
    with:
      DOCKER_PATH_CONTEXT: .
      DOCKER_BUILD_DOCKERFILE: ./Dockerfile
      DOCKER_TAGS: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}:${{ github.sha }}
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    secrets: inherit

  release:
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - docker-build-and-image-scan
    uses: milsman2/python-app-template/.github/workflows/release.yaml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      UV_VERSION: ${{ inputs.UV_VERSION || vars.UV_VERSION || '0.12.10' }}
      PYTHON_VERSION: ${{ inputs.PYTHON_VERSION || vars.PYTHON_VERSION || '3.13' }}

  docker-release:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: milsman2/python-app-template/.github/workflows/docker-build-and-scan.yaml@main
    with:
      DOCKER_PATH_CONTEXT: .
      DOCKER_BUILD_DOCKERFILE: ./Dockerfile
      DOCKER_TAGS: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}:${{ needs.release.outputs.tag }}
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    secrets: inherit
