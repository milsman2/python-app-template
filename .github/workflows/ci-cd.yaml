name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/ruff.yaml
    with:
      UV_VERSION: ${{ vars.UV_VERSION }}
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}

  test:
    needs: lint
    uses: ./.github/workflows/pytest.yaml
    with:
      UV_VERSION: ${{ vars.UV_VERSION }}
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}

  docker-build-and-image-scan:
    if: github.event_name == 'push'
    needs: test
    uses: ./.github/workflows/docker-build-and-scan.yaml
    with:
      DOCKER_PATH_CONTEXT: .
      DOCKER_BUILD_DOCKERFILE: ./Dockerfile
      DOCKER_TAGS: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}:${{ github.sha }}
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    secrets: inherit

  release:
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - docker-build-and-image-scan
    uses: ./.github/workflows/release.yaml
    permissions:
      contents: write
    secrets: inherit
    with:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
      UV_VERSION: ${{ vars.UV_VERSION }}
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
      DOCKER_PATH_CONTEXT: .
      DOCKER_BUILD_DOCKERFILE: ./Dockerfile
