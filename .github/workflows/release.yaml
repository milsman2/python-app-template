name: UV - Release (Reusable)

on:
  workflow_call:
    inputs:
      DOCKER_USERNAME:
        required: true
        type: string

      DOCKER_REPOSITORY:
        required: true
        type: string

      UV_VERSION:
        required: false
        type: string
        default: '0.12.7'

      PYTHON_VERSION:
        required: false
        type: string
        default: '3.13'

      DOCKER_PATH_CONTEXT:
        required: true
        type: string

      DOCKER_BUILD_DOCKERFILE:
        required: true
        type: string

jobs:
  semantic-release:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Ensure checkout is at workflow SHA
        run: git reset --hard "${{ github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ inputs.UV_VERSION }}
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  docker-release:
    needs: semantic-release
    if: needs.semantic-release.outputs.tag != ''
    uses: milsman2/python-app-template/.github/workflows/docker-build-and-scan.yaml@v1.19.1
    secrets: inherit
    with:
      DOCKER_PATH_CONTEXT: ${{ inputs.DOCKER_PATH_CONTEXT }}
      DOCKER_BUILD_DOCKERFILE: ${{ inputs.DOCKER_BUILD_DOCKERFILE }}
      DOCKER_TAGS: ${{ inputs.DOCKER_USERNAME }}/${{ inputs.DOCKER_REPOSITORY }}:${{ needs.semantic-release.outputs.tag }}
      DOCKER_USERNAME: ${{ inputs.DOCKER_USERNAME }}
